[project]
name = "ciphlet"
version = "0.1.0"
description = "Ciphlet — Cybersecurity Intelligent Personal Helper for Learning, Exploration & Training"
requires-python = ">=3.10"
dependencies = [
    # Free-provider chain (§20A): Groq + Gemini SDKs. OpenRouter needs no
    # extra dependency — it's called via stdlib urllib (see
    # brain/openrouter_provider.py).
    "groq>=0.9",
    "google-genai>=0.1",
    "python-dotenv>=1.0",
    # Local Intelligence leg (§20A): the official Ollama client, talking to
    # a persistent `ollama serve` over HTTP (see brain/ollama_provider.py).
    # Core, not optional — "completely free/local baseline that remains
    # usable with zero API credits" must always be available. Requires
    # Ollama itself installed separately on the Pi (see deploy script).
    "ollama>=0.4",
]

[project.optional-dependencies]
# Premium Cloud Intelligence leg — only needed if you'll ever run
# `ciphlet chat --premium` / `ciphlet voice --premium` (opt-in, metered).
premium = [
    "anthropic>=0.40",
]
# Voice pipeline (§20B) — wake word, VAD, STT, TTS, mic/speaker I/O.
# Adopt-adapt evidence for this combination: docs/THIRD_PARTY_NOTICES.md.
voice = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "vosk>=0.3.45",
    "webrtcvad>=2.0.10",
    # webrtcvad 2.0.10's webrtcvad.py does `import pkg_resources` (setuptools),
    # which a Python 3.13 venv does not ship — without this, VAD fails to
    # import on the Pi. <81: pkg_resources is being removed from setuptools.
    "setuptools<81",
    # "Hey Ciphlet" wake phrase without a trained model (PocketSphinx keyword
    # spotting — the technique CIPHER's macOS wake listener used). cp313
    # aarch64 wheels exist, so no build step on the Pi.
    "pocketsphinx>=5.1.1,<6",
    "piper-tts>=1.2",
    # openWakeWord is deliberately NOT listed here — deploy/install_voice.sh
    # installs it with `pip install --no-deps 'openwakeword==0.6.0'`.
    # Its metadata hard-requires `tflite-runtime` on Linux, which has no
    # wheels past CPython 3.11 (Pi OS ships 3.13 → unsatisfiable), and no
    # newer openWakeWord exists on PyPI. Ciphlet runs it on the ONNX backend
    # instead (OpenWakeWordProvider passes inference_framework="onnx"), so
    # tflite is never needed. The lines below are openWakeWord 0.6.0's other
    # runtime imports (verified against its 0.6.0 source), declared here
    # since --no-deps skips them. Bump the pin only after re-verifying.
    "onnxruntime>=1.10,<2",
    "scipy>=1.3,<2",
    "scikit-learn>=1,<2",
    "tqdm>=4,<5",
    "requests>=2,<3",
]

[project.scripts]
ciphlet = "ciphlet.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ciphlet*"]
